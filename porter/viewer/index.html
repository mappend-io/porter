<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Porter - CesiumJS Viewer</title>
    </head>
    <body>
        <div id="cesiumContainer"></div>
        <div id="info">
            <div>Hover: <span id="coords">—</span></div>
            <div>Camera height: <span id="height">—</span> m</div>
            <div class="options">
                <label><input type="checkbox" id="option-globe" /> Globe</label>
                <label><input type="checkbox" id="option-lulc" /> Land cover</label>
                <label><input type="checkbox" id="option-wireframe" /> Wireframe</label>
            </div>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
